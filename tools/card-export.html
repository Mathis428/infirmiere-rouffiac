<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Export des faces de la carte</title>
<style>
  @font-face { font-family: "Lato"; src: url("../assets/fonts/lato-400-normal.woff2") format("woff2"); font-weight: 400; } @font-face { font-family: "Lato"; src: url("../assets/fonts/lato-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "Lato"; src: url("../assets/fonts/lato-700-normal.woff2") format("woff2"); font-weight: 700; } @font-face { font-family: "Lato"; src: url("../assets/fonts/lato-900-normal.woff2") format("woff2"); font-weight: 900; }
</style>
</head>
<body>
<pre id="out"></pre>
<script type="module">
  import { createFaceCanvas, ensureCardFonts, CARD_RATIO } from '../src/card-art.js';
  await ensureCardFonts();
  const out = {};
  for (const face of ['front', 'back']) {
    // Coins arrondis comme la vraie carte.
    const src = createFaceCanvas(face, 1600);
    const c = document.createElement('canvas');
    c.width = src.width;
    c.height = src.height;
    const ctx = c.getContext('2d');
    const r = c.width * 0.032;
    ctx.beginPath();
    ctx.roundRect(0, 0, c.width, c.height, r);
    ctx.clip();
    ctx.drawImage(src, 0, 0);
    out[face] = c.toDataURL('image/png');
  }
  document.getElementById('out').textContent = JSON.stringify(out);
</script>
</body>
</html>
